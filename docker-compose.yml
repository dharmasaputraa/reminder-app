services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-8080}:8080"   # dipublish agar cloudflared di HOST bisa mengarah ke sini
    volumes:
      - ./data:/data
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflared]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [app]
    networks: [internal]

  gotify:
    image: gotify/server:latest
    profiles: [gotify]
    restart: unless-stopped
    volumes:
      - ./gotify-data:/app/data
    networks: [internal]

  litestream:
    image: litestream/litestream:latest
    profiles: [litestream]
    restart: unless-stopped
    env_file: .env
    command: replicate -config /etc/litestream.yml
    volumes:
      - ./data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    depends_on: [app]
    networks: [internal]

networks:
  internal: {}
